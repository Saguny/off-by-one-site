# Add inside the off-by-one.digital server block (the 443 one), next to the existing locations.
# Both beat the catch-all "location /" that proxies to the bot, so these keep working when the bot is down.
location = / {
    root /opt/off-by-one-site/public;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location /site/ {
    root /opt/off-by-one-site/public;
}
