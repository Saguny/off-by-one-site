# Add inside the off-by-one.digital server block (the 443 one), next to the existing locations.
# Both beat the catch-all "location /" that proxies to the bot, so these keep working when the bot is down.
location = / {
    root /opt/off-by-one-site/public;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location /site/ {
    root /opt/off-by-one-site/public;
}

# Crew bios. Add a new member's folder name to both lists.
location ~ ^/(saguny|warpstar|lennart)/?$ {
    root /opt/off-by-one-site/public;
    try_files /$1/index.html =404;
    add_header Cache-Control "no-cache";
}

location ~ ^/biographies/(saguny|warpstar|lennart)/?$ {
    return 301 /$1;
}

location ~ ^/perennial/?$ {
    root /opt/perennial-gallery;
    try_files /perennial/index.html =404;
    add_header Cache-Control "no-cache";
}
